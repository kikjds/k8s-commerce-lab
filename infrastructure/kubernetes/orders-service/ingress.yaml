apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-service
  labels:
    app.kubernetes.io/name: orders-service
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  name: http