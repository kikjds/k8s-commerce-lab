name: Detect-Test-Push
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  detect-change:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend-service:
              - 'apps/frontend-service/**'
            orders-service:
              - 'apps/orders-service/**'
            product-service:
              - 'apps/product-service/**'

  test-project:
    needs: detect-change
    if: needs.detect-change.outputs.services != '[]'
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-change.outputs.services) }}
    steps:
      - name: clone repository
        uses: actions/checkout@v7
      - name: configure nodejs enviroment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/${{matrix.service}}/package-lock.json
          
      - name: Install dependencies
        working-directory: apps/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: apps/${{ matrix.service }}
        run: npm run test
  
  push-images:
    needs: [detect-change, test-project]
    if: github.event_name == 'push' && needs.detect-change.outputs.services != '[]'
    name: Build and push ${{matrix.service}}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-change.outputs.services) }}
    steps:
      - name: clone repositories
        uses: actions/checkout@v7
      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ${{vars.DOCKER_USERNAME}}/${{ matrix.service }}:latest
          build-args: |
            VITE_S3_BUCKET=${{ vars.VITE_S3_BUCKET }}
            VITE_S3_REGION=${{ vars.VITE_S3_REGION }}