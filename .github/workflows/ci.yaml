name: Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-project:
    name: Test ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: 
          - frontend-service
          - product-service
          - orders-service
    steps:
      - name: clone repository
        uses: actions/checkout@v7
      - name: configure nodejs enviroment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/${{matrix.directory}}/package-lock.json
          
      - name: Install dependencies
        working-directory: apps/${{ matrix.directory }}
        run: npm ci

      - name: Run tests
        working-directory: apps/${{ matrix.directory }}
        run: npm run test
  
  push-images:
    if: github.event_name == 'push'
    name: Build and push ${{matrix.directory}}
    needs: test-project
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
         - frontend-service
         - orders-service
         - product-service
    steps:
      - name: clone repositories
        uses: actions/checkout@v7
      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.directory }}
          push: true
          tags: ${{vars.DOCKER_USERNAME}}/${{ matrix.directory }}:latest
          build-args: |
            VITE_S3_BUCKET=${{ vars.VITE_S3_BUCKET }}
            VITE_S3_REGION=${{ vars.VITE_S3_REGION }}